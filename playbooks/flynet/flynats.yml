---
- name: Ensure flynet flynats app is deployed
  hosts: flynats
  gather_facts: false
  roles:
    - role: linuxhq.flyio.apps
      run_once: true

- name: Ensure flynet flynats machines are deployed
  hosts: flynats
  gather_facts: false
  serial: 1
  roles:
    - linuxhq.flyio.volumes
    - linuxhq.flyio.machines

- name: Ensure flynet nats cluster is healthy
  hosts: flynats
  gather_facts: false
  roles:
    - linuxhq.flyio.machines_info
  post_tasks:
    - name: Ensure nats health checks are passing
      linuxhq.flyio.machines_info:
        api_token: "{{ machines_info_api_token }}"
        app_name: "{{ flyio_app_name }}"
        id: "{{ _machines_info_dict[inventory_hostname].id }}"
      register: __nats_health
      until: >-
        __nats_health.machines |
        selectattr('checks', 'defined') |
        map(attribute='checks') |
        flatten |
        selectattr('status', 'equalto', 'passing') |
        list |
        length == 1
      retries: 30
      delay: 5

- name: Ensure flynet nats cluster routes are synced
  hosts: flynats
  gather_facts: false
  roles:
    - linuxhq.flyio.machines_info
  post_tasks:
    - name: Ensure nats routez reports peer connections
      linuxhq.flyio.machines_exec:
        api_token: "{{ machines_info_api_token }}"
        app_name: "{{ flyio_app_name }}"
        command: wget -qO- http://localhost:8222/routez
        id: "{{ _machines_info_dict[inventory_hostname].id }}"
      register: __routez_result
      until: >-
        (__routez_result.stdout | default('{}') | from_json).get('num_routes', 0) >= 2
      retries: 30
      delay: 5
      changed_when: false
...
