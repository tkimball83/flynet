---
- name: Ensure flynet nats are deployed
  hosts: nats
  gather_facts: false
  serial: 1
  tasks:
    - name: Ensure the flyio app exists
      ansible.builtin.import_role:
        name: linuxhq.flyio.apps
    - name: Ensure the JetStream storage volume exists
      linuxhq.flyio.volumes:
        api_token: "{{ flyio_api_token }}"
        app_name: "{{ inventory_hostname }}"
        name: jetstream
        region: "{{ flyio_region }}"
        size_gb: 1
        state: present
    - name: Ensure the flyio machine is deployed
      ansible.builtin.import_role:
        name: linuxhq.flyio.machines

- name: Ensure flynet nats cluster is healthy
  hosts: nats
  gather_facts: false
  tasks:
    - name: Ensure nats health checks are passing
      linuxhq.flyio.machines_info:
        api_token: "{{ machines_info_api_token }}"
        app_name: "{{ inventory_hostname }}"
      register: __nats_health
      until: >-
        __nats_health.machines |
        selectattr('checks', 'defined') |
        map(attribute='checks') |
        flatten |
        selectattr('status', 'equalto', 'passing') |
        list |
        length == 1
      retries: 30
      delay: 5

- name: Ensure flynet nats cluster routes are synced
  hosts: nats
  gather_facts: false
  tasks:
    - name: Retrieve machine id
      linuxhq.flyio.machines_info:
        api_token: "{{ machines_info_api_token }}"
        app_name: "{{ inventory_hostname }}"
      register: __machines_result

    - name: Ensure nats routez reports peer connections
      ansible.builtin.command:
        cmd: >-
          flyctl machine exec
          {{ __machines_result.machines[0].id }}
          -a {{ inventory_hostname }}
          "wget -qO- http://localhost:8222/routez"
      register: __routez_result
      until: >-
        (__routez_result.stdout | default('{}') | from_json).get('num_routes', 0) >= 2
      retries: 30
      delay: 5
      changed_when: false

- name: Ensure flynet bots are deployed
  hosts: flynet
  serial: 1
  gather_facts: false
  roles:
    - linuxhq.flyio.apps
    - linuxhq.flyio.machines
...
