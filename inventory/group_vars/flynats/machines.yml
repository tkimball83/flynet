---
machines_list:
  - app_name: "{{ flyio_app_name }}"
    machines:
      - checks:
          healthz:
            interval: 10s
            path: /healthz?js-enabled-only=true
            port: 8222
            timeout: 2s
            type: http
        env:
          NATS_CLUSTER_ADVERTISE: >-
            {{ flynet_nats.cluster.advertise[flyio_region] }}
          NATS_SERVER_NAME: "{{ inventory_hostname }}"
        files:
          - guest_path: /nats-server.conf
            raw_value: >-
              {{ lookup('template', 'nats-server.conf.j2') | b64encode }}
        guest:
          cpu_kind: shared
          cpus: 1
          memory_mb: 256
        image: nats:2.14.4-alpine
        init:
          cmd:
            - exec nats-server --config /nats-server.conf
          entrypoint:
            - /bin/sh
            - -c
        mounts:
          - path: /data
            volume: >-
              {{ (_volumes_info_list |
                  selectattr('name', 'equalto', flyio_region) |
                  selectattr('state', 'equalto', 'created') |
                  first).id }}
        name: "{{ inventory_hostname }}"
        region: "{{ flyio_region }}"
        restart:
          policy: always
...
